[project]
name = "emudoc-backend"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "argon2-cffi>=25.1.0",
    "boto3>=1.43.111",
    "cryptography>=50.0.2",
    "fastapi>=0.143.0",
    "httpx>=0.28.1",
    "markdown-it-py>=4.2.0",
    "openpyxl>=3.1",
    "pdfplumber>=0.11.10",
    "pgvector>=0.5.1",
    "pi-heif>=1.4.0",
    "pillow>=13.0.0",
    "prometheus-client>=0.26.0",
    "psycopg[binary]>=3.3.6",
    "pydantic-ai-slim[anthropic,google,openrouter]>=2.55.0",
    "pydantic-settings>=2.15.0",
    "pypdfium2>=5.14.0",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.32",
    "python-pptx>=1.0.2",
    "reportlab>=5.0.1",
    "sentry-sdk>=2.71.0",
    "sqlalchemy>=2.1.4",
    "striprtf>=0.0.29",
    "tzdata>=2026.5",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
audit = [
    "pip-audit>=2.10.1",
]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 100

# The upload client runs on its members' computers, from Python 3.9 (app/client/), and so does
# the copy of it the suite keeps from before it moved onto the versioned API.
[tool.ruff.per-file-target-version]
"app/client/emudoc_upload.py" = "py39"
"tests/upload_client_before_v1.py" = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
