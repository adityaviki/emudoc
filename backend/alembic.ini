# Alembic's settings. Run it from this directory: `uv run alembic upgrade head`.
# The database URL is not here: migrations/env.py takes it from the app's settings
# (DATABASE_URL in .env or the environment), so the command line and the app always see the
# same database.

[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os
# Files sort by when they were written: 20261011_1830_initial_schema.py.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s
truncate_slug_length = 40

# Logging for the command line, so `alembic upgrade` says which migrations it ran. A process
# that has set up logging already, such as the test suite, keeps its own (see migrations/env.py).
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
