# The checks every pull request and every commit on main pass, on GitHub's runners: the
# backend's suite in three parts, the frontend's checks, the browser test, the load test at a
# small size, the image run as a team runs it, the history's secrets, and the scripts and the
# configuration (CONTRIBUTING.md, "Checks"). Each step runs the command a contributor would, so
# a red step is reproduced by running it on a checkout. No job holds a secret or writes to the
# repository, so a pull request from a fork runs every one; main's ruleset requires them all
# (.github/rulesets/main.json). The suite through a pooler, the embeddings server and the audits
# have workflows of their own, run when what they check changes (pooler.yml, embeddings.yml,
# audit.yml). Actions are pinned by commit and the tools that come as images by digest: a moved
# tag changes nothing here until this file does.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# The checks read the code: no step writes to the repository or holds a secret.
permissions:
  contents: read

# A newer push to a pull request replaces its checks in progress; every commit on main is
# checked to the end.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The promtool of this Prometheus checks the example rules (deploy/prometheus); it moves by
  # hand, as the other tools here do.
  PROMETHEUS: prom/prometheus:v3.16.0@sha256:e04987641b57704f408e31f6373ba4138ecf27cb4a165d24aabb6c38fddd0f06
  SHELLCHECK: koalaman/shellcheck:v0.11.0@sha256:61862eba1fcf09a484ebcc6feea46f1782532571a34ed51fedf90dd25f925a8d
  ACTIONLINT: rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
  TRIVY: aquasec/trivy:0.73.0@sha256:7cced7cae583819fc7806d4cbc0dbbc7cad18b99f7d3e235192e6da8c091045c
  # Also the pre-commit hook's (.githooks/pre-commit), which reads it from here.
  GITLEAKS: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f

jobs:
  # The suite in three parts, each in a job of its own (`pytest --shard`, which
  # parts it by a hash of each test's id), so that the slowest takes a third of the time.
  backend:
    name: Backend (${{ matrix.database }}, ${{ matrix.shard }} of 3)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # The same suite through pgbouncer is the Pooler workflow's (pooler.yml), on a change
        # to what talks to the database in a way a pooler sees.
        database: [postgres]
        shard: [1, 2, 3]
        include:
          - database: postgres
            services: db
            server: emudoc:emudoc@127.0.0.1:5437
    env:
      TEST_DATABASE_SERVER: ${{ matrix.server }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Every job restores one cache of the dependencies, and one saves it: two would race for
      # the same key.
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: 0.11.15
          cache-dependency-glob: backend/uv.lock
          save-cache: ${{ matrix.database == 'postgres' && matrix.shard == 1 }}
      # The development database of docker-compose.yml, the server the suite expects.
      - name: Database
        run: docker compose up -d --wait ${{ matrix.services }}
      # --locked: a pyproject.toml changed without its uv.lock fails here.
      - name: Dependencies
        run: uv --directory backend sync --locked
      # The upload client runs on members' computers from Python 3.9 (backend/app/client/), so
      # the suite runs it over HTTP by that Python (UPLOAD_CLIENT_PYTHON,
      # tests/test_upload_client.py), which uv fetches as it fetches the suite's own.
      - name: Python for the upload client
        run: |
          uv python install 3.9
          echo "UPLOAD_CLIENT_PYTHON=$(uv python find --no-project 3.9)" >> "$GITHUB_ENV"
      # The backend, and the end-to-end test's stand-in model (frontend/e2e/standin.py), which
      # takes the backend's settings.
      - name: Lint
        if: matrix.database == 'postgres' && matrix.shard == 1
        run: uv --directory backend run ruff check --output-format=github . ../frontend/e2e
      - name: Format
        if: matrix.database == 'postgres' && matrix.shard == 1
        run: uv --directory backend run ruff format --diff . ../frontend/e2e
      - name: Tests
        run: uv --directory backend run pytest -q --shard ${{ matrix.shard }}/3

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The pnpm and Node the image builds the frontend with (Dockerfile).
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.2.2
          package_json_file: frontend/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      # Vitest, in Node: the modules' own tests (src/**/*.test.ts).
      - name: Unit tests
        run: pnpm test
      # tsc -b, then vite build.
      - name: Build
        run: pnpm build
      # The built scripts, gzipped, against their budget (BUDGET in frontend/scripts/size.ts,
      # which says how to raise it); Vite's own chunk size warning only warns.
      - name: Bundle size
        run: pnpm size

  # A member's way through the app in a browser (frontend/e2e): sign up, make a project, upload
  # a contract, see it indexed, find it by searching, ask about it and open the passage the
  # answer cites. The built page and the API run as one server against the compose database,
  # the model and the embeddings endpoint being a stand-in (frontend/e2e/standin.py): no key,
  # and the same answer every run. On a failure the report and the trace are kept for a week.
  e2e:
    name: End to end
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The backend job's cache of the dependencies, which that job alone saves.
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: 0.11.15
          cache-dependency-glob: backend/uv.lock
          save-cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.2.2
          package_json_file: frontend/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Database
        run: docker compose up -d --wait db
      - name: Dependencies
        run: |
          uv --directory backend sync --locked
          pnpm --dir frontend install --frozen-lockfile
      # The Chromium of the @playwright/test the lock file names, and the libraries it needs.
      - name: Browser
        run: pnpm --dir frontend exec playwright install --with-deps chromium
      - name: Build
        run: pnpm --dir frontend build
      - name: Tests
        run: pnpm --dir frontend e2e
      - name: Report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7

  # The load test (docs/load.md) at a size that takes a minute, against the compose
  # database and the stand-in: its figures mean nothing on a runner, but a change it leans on (a
  # route, a reply, the prompt the stand-in reads) fails here rather than in the next real run.
  # On a failure its logs are kept for a week.
  loadtest:
    name: Load test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The backend job's cache of the dependencies, which that job alone saves.
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: 0.11.15
          cache-dependency-glob: backend/uv.lock
          save-cache: false
      - name: Database
        run: docker compose up -d --wait db
      - name: Dependencies
        run: uv --directory backend sync --locked
      - name: Small
        run: >-
          uv --directory backend run --locked python -m loadtest --dir "$RUNNER_TEMP/load"
          --documents 40 --batch 10 --searches 20 --small-documents 4 --chats 4 --rounds 1
          --first-token 0.2 --paced-documents 6 --index-seconds 0.2 --scan-pages 4 --sheet-mb 1
      - name: Logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: load-test
          path: ${{ runner.temp }}/load/*.log
          retention-days: 7

  # The image of the commit, built once, named by its full SHA (the version /api/health
  # reports) and smoke-tested: deploy/compose.yml run from it with the quick start's .env, in a
  # project of its own (check-image.sh). Its known vulnerabilities are Audit's, every week and
  # on a change to what it is built from, and Publish's before a release's image is pushed.
  image:
    name: Image
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        run: docker build -t "emudoc:$GITHUB_SHA" --build-arg "VERSION=$GITHUB_SHA" .
      - name: Run
        run: .github/scripts/check-image.sh "emudoc:$GITHUB_SHA"

  # A key or a .env file in any commit, gitleaks' rules and .gitleaks.toml's. Found here, it has
  # been pushed: revoke the key first, then rewrite the history. The pre-commit hook finds it
  # before the commit.
  secrets:
    name: Secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Every commit of every branch, not only the one checked.
          fetch-depth: 0
      # --ignore-gitleaks-allow: an exception is an entry in .gitleaks.toml with its reason,
      # never a comment in the code.
      - name: History
        run: >-
          docker run --rm -v "$PWD:/repo:ro" -w /repo "$GITLEAKS" git --redact --verbose
          --no-banner --ignore-gitleaks-allow .

  scripts:
    name: Scripts and configuration
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Every tracked file whose first line is a shell's #!, so a new script is checked
      # without being named here.
      - name: Shell scripts
        run: |
          # shellcheck disable=SC2016 # the $0 is awk's
          mapfile -t scripts < <(git ls-files -z |
            xargs -0 awk 'FNR == 1 && $0 ~ "^#!.*[/ ](ba)?sh$" { print FILENAME } { nextfile }')
          docker run --rm -v "$PWD:/mnt" -w /mnt "$SHELLCHECK" "${scripts[@]}"
      - name: Workflows
        run: docker run --rm -v "$PWD:/repo" -w /repo "$ACTIONLINT" -color
      # The example Prometheus configuration and the alerting rules it loads, each rule against
      # the series that should and should not fire it (alerts.test.yml), by the promtool of the
      # Prometheus above.
      - name: Alerting rules
        run: |
          promtool() {
            docker run --rm -v "$PWD/deploy/prometheus:/p:ro" -w /p --entrypoint promtool \
              "$PROMETHEUS" "$@"
          }
          promtool check config prometheus.yml
          promtool test rules alerts.test.yml
      # uv, pnpm, Node and Python at the Dockerfile's versions wherever else they are named.
      - name: Tool versions
        run: .github/scripts/check-versions.sh
      # The Dockerfile and the compose files; what was looked at and accepted is in
      # .trivyignore.yaml with its reason. The checks are the ones this trivy release carries,
      # so a newer set changes nothing until the image does.
      - name: Misconfigurations
        run: >-
          docker run --rm -v "$PWD:/src:ro" -w /src "$TRIVY" config --quiet --skip-check-update
          --exit-code 1 --ignorefile .trivyignore.yaml .
