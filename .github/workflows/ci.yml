# The checks a change passes before it is called done (CLAUDE.md, "Commands"), on every push to
# main, on every pull request, and by hand on any branch (Actions, CI, Run workflow). Each step
# runs the command a developer would, so a red step is reproduced by running it on a checkout.
# Actions are pinned by commit and the tools that come as images by digest: a moved tag changes
# nothing here until this file does. A push to main also pushes the image it checked and, once
# every check passed, releases it on staging (deploying.md, "Releases from CI").
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# The checks read the code: no step writes to the repository or holds a secret. The two jobs
# that reach the deployment on main ask GitHub for a token of their own, which AWS trades for an
# hour of a role that trusts main alone (deploy/aws/account, modules/environment/release.tf).
permissions:
  contents: read

# A newer push to a pull request replaces its checks in progress; every commit on main is
# checked to the end.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  SHELLCHECK: koalaman/shellcheck:v0.11.0@sha256:61862eba1fcf09a484ebcc6feea46f1782532571a34ed51fedf90dd25f925a8d
  ACTIONLINT: rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
  TRIVY: aquasec/trivy:0.73.0@sha256:7cced7cae583819fc7806d4cbc0dbbc7cad18b99f7d3e235192e6da8c091045c
  # Also the pre-commit hook's (.githooks/pre-commit), which reads it from here.
  GITLEAKS: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f

jobs:
  backend:
    name: Backend (${{ matrix.database }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - database: postgres
            services: db
            server: emudoc:emudoc@127.0.0.1:5437
          # Through pgbouncer in transaction mode, as a deployment behind such a pooler runs,
          # with the worker's listener on Postgres itself (CLAUDE.md, "The database server").
          - database: pgbouncer
            services: db pgbouncer
            server: emudoc:emudoc@127.0.0.1:6438
            pooler: transaction
            listen: postgresql+psycopg://emudoc:emudoc@127.0.0.1:5437/emudoc_test
    env:
      TEST_DATABASE_SERVER: ${{ matrix.server }}
      DATABASE_POOLER: ${{ matrix.pooler }}
      DATABASE_LISTEN_URL: ${{ matrix.listen }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Both jobs restore one cache of the dependencies, and one saves it: two would race for
      # the same key.
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: 0.11.15
          cache-dependency-glob: backend/uv.lock
          save-cache: ${{ matrix.database == 'postgres' }}
      # The development database of docker-compose.yml, the server the suite expects.
      - name: Database
        run: docker compose up -d --wait ${{ matrix.services }}
      # --locked: a pyproject.toml changed without its uv.lock fails here.
      - name: Dependencies
        run: uv --directory backend sync --locked
      # The backend, and the end-to-end test's stand-in model (frontend/e2e/standin.py), which
      # takes the backend's settings.
      - name: Lint
        if: matrix.database == 'postgres'
        run: uv --directory backend run ruff check --output-format=github . ../frontend/e2e
      - name: Format
        if: matrix.database == 'postgres'
        run: uv --directory backend run ruff format --diff . ../frontend/e2e
      - name: Tests
        run: uv --directory backend run pytest -q

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The pnpm and Node the image builds the frontend with (Dockerfile).
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.2.2
          package_json_file: frontend/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      # Vitest, in Node: the modules' own tests (src/**/*.test.ts).
      - name: Unit tests
        run: pnpm test
      # tsc -b, then vite build.
      - name: Build
        run: pnpm build

  # A member's way through the app in a browser (frontend/e2e): sign up, make a project, upload
  # a contract, see it indexed, find it by searching, ask about it and open the passage the
  # answer cites. The built page and the API run as one server against the compose database,
  # the model and the embeddings endpoint being a stand-in (frontend/e2e/standin.py): no key,
  # and the same answer every run. On a failure the report and the trace are kept for a week.
  e2e:
    name: End to end
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The backend job's cache of the dependencies, which that job alone saves.
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: 0.11.15
          cache-dependency-glob: backend/uv.lock
          save-cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.2.2
          package_json_file: frontend/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Database
        run: docker compose up -d --wait db
      - name: Dependencies
        run: |
          uv --directory backend sync --locked
          pnpm --dir frontend install --frozen-lockfile
      # The Chromium of the @playwright/test the lock file names, and the libraries it needs.
      - name: Browser
        run: pnpm --dir frontend exec playwright install --with-deps chromium
      - name: Build
        run: pnpm --dir frontend build
      - name: Tests
        run: pnpm --dir frontend e2e
      - name: Report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7

  # The image of the commit, built once, named by its full SHA (the version /api/health
  # reports) and smoke-tested. On main it is also scanned as the Audit workflow scans it, and
  # pushed to the account's repository, which takes images from this job's role alone; the
  # Staging job below releases it once every check passed. Without the repository variables
  # (deploying.md, "Releases from CI") the job stops after the smoke test.
  image:
    name: Image
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # A pull request's token says pull_request and another branch's names it: AWS refuses both.
    permissions:
      contents: read
      id-token: write
    env:
      PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AWS_PUSH_ROLE != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        run: docker build -t "emudoc:$GITHUB_SHA" --build-arg "VERSION=$GITHUB_SHA" .
      - name: Database
        run: docker compose up -d --wait db
      - name: Run
        run: .github/scripts/check-image.sh "emudoc:$GITHUB_SHA"
      # What is known today about what would ship: a high or critical vulnerability with a fix
      # stops the release here, as it fails Audit's morning run (audit.yml, the same command).
      - name: Vulnerabilities
        if: env.PUSH == 'true'
        run: >-
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/src:ro" -w /src
          "$TRIVY" image --quiet --skip-version-check --scanners vuln,secret --severity
          HIGH,CRITICAL --ignore-unfixed --table-mode detailed --exit-code 1
          --ignorefile .trivyignore.yaml "emudoc:$GITHUB_SHA"
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        if: env.PUSH == 'true'
        with:
          role-to-assume: ${{ vars.AWS_PUSH_ROLE }}
          role-session-name: github-${{ github.run_id }}-${{ github.run_attempt }}
          aws-region: ${{ vars.AWS_REGION || 'eu-central-1' }}
      # Unless the repository has it already, as when the job runs again.
      - name: Push
        if: env.PUSH == 'true'
        run: deploy/aws/push-image.sh "emudoc:$GITHUB_SHA"

  # The compose file's embeddings service, started as a deployment starts it, against the
  # vectors the deployments' databases hold and the refusal the app cuts a long input on
  # (.github/scripts/check-embeddings.sh): Dependabot proposes a new build of llama.cpp's server
  # every week, and nothing else here starts it.
  embeddings:
    name: Embeddings
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Vectors
        run: .github/scripts/check-embeddings.sh

  opentofu:
    name: OpenTofu
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.12.6
          tofu_wrapper: false
      # The AWS provider is some 700 MB unpacked and every root needs it: one download for all
      # of them, kept between runs for as long as the lock files name the same versions.
      - name: Provider cache
        run: |
          mkdir -p "$HOME/.cache/opentofu"
          echo "TF_PLUGIN_CACHE_DIR=$HOME/.cache/opentofu" >>"$GITHUB_ENV"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/opentofu
          key: opentofu-${{ hashFiles('deploy/aws/*/.terraform.lock.hcl', 'deploy/aws/modules/environment/.terraform.lock.hcl') }}
      - name: Format
        run: tofu fmt -check -diff -recursive deploy/aws
      # Without the state's bucket, which validating needs no more than the KMS key the
      # roots' encryption names.
      - name: Validate
        run: |
          for root in account staging production; do
            tofu -chdir="deploy/aws/$root" init -backend=false -input=false
            tofu -chdir="deploy/aws/$root" validate
          done
      # The module and the account root against a mocked AWS: no account, no credentials. The
      # account root was set up by the step before.
      - name: Test
        run: |
          tofu -chdir=deploy/aws/modules/environment init -input=false
          tofu -chdir=deploy/aws/modules/environment test
          tofu -chdir=deploy/aws/account test

  # A key or a .env file in any commit, gitleaks' rules and .gitleaks.toml's. Found here, it has
  # been pushed: revoke the key first, then rewrite the history. The pre-commit hook finds it
  # before the commit.
  secrets:
    name: Secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Every commit of every branch, not only the one checked.
          fetch-depth: 0
      # --ignore-gitleaks-allow: an exception is an entry in .gitleaks.toml with its reason,
      # never a comment in the code.
      - name: History
        run: >-
          docker run --rm -v "$PWD:/repo:ro" -w /repo "$GITLEAKS" git --redact --verbose
          --no-banner --ignore-gitleaks-allow .

  scripts:
    name: Scripts and configuration
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Every tracked file whose first line is a shell's #!, so a new script is checked
      # without being named here.
      - name: Shell scripts
        run: |
          # shellcheck disable=SC2016 # the $0 is awk's
          mapfile -t scripts < <(git ls-files -z |
            xargs -0 awk 'FNR == 1 && $0 ~ "^#!.*[/ ](ba)?sh$" { print FILENAME } { nextfile }')
          docker run --rm -v "$PWD:/mnt" -w /mnt "$SHELLCHECK" "${scripts[@]}"
      - name: Workflows
        run: docker run --rm -v "$PWD:/repo" -w /repo "$ACTIONLINT" -color
      # The Prometheus configuration and the alerting rules it loads, each rule against the
      # series that should and should not fire it (alerts.test.yml), and the AWS instance's
      # Alertmanager configuration, by the promtool and amtool of the images the instance runs
      # (deploy/aws/compose.yml), so that what Dependabot moves there is what checks them.
      - name: Alerting rules
        run: |
          image() {
            sed -nE "s|^ +image: (prom/$1:[^ ]+@sha256:[0-9a-f]{64})$|\1|p" deploy/aws/compose.yml
          }
          prometheus=$(image prometheus) alertmanager=$(image alertmanager)
          : "${prometheus:?deploy/aws/compose.yml names no Prometheus}"
          : "${alertmanager:?deploy/aws/compose.yml names no Alertmanager}"
          promtool() {
            docker run --rm -v "$PWD/deploy/prometheus:/p:ro" -w /p --entrypoint promtool \
              "$prometheus" "$@"
          }
          promtool check config prometheus.yml
          promtool test rules alerts.test.yml
          docker run --rm -v "$PWD/deploy/aws:/a:ro" -w /a --entrypoint amtool "$alertmanager" \
            check-config alertmanager.yml
      # uv, pnpm, Node and Python at the Dockerfile's versions wherever else they are named.
      - name: Tool versions
        run: .github/scripts/check-versions.sh
      # The deployment's OpenTofu and the Dockerfile; what was looked at and accepted is in
      # .trivyignore.yaml with its reason. The checks are the ones this trivy release carries,
      # so a newer set changes nothing until the image does.
      - name: Misconfigurations
        run: >-
          docker run --rm -v "$PWD:/src:ro" -w /src "$TRIVY" config --quiet --skip-check-update
          --exit-code 1 --ignorefile .trivyignore.yaml .

  # Every commit on main that passed every check runs on staging: the image the Image job
  # pushed, released by deploy/aws/release.sh, which waits until staging's /api/health names
  # the commit. One release at a time, whichever workflow starts it; production is the Release
  # workflow's, by hand, and takes only what ran here.
  staging:
    name: Staging
    needs: [backend, frontend, e2e, image, embeddings, opentofu, secrets, scripts]
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main'
      && vars.AWS_PUSH_ROLE != '' && vars.AWS_STAGING_ROLE != ''
    runs-on: ubuntu-24.04
    # Systems Manager gives the release an hour on the instance (release.sh).
    timeout-minutes: 70
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: release-staging
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_STAGING_ROLE }}
          role-session-name: github-${{ github.run_id }}-${{ github.run_attempt }}
          aws-region: ${{ vars.AWS_REGION || 'eu-central-1' }}
      - name: Release
        run: deploy/aws/release.sh staging "$GITHUB_SHA"
