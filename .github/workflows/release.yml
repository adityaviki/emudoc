# A release by hand (Actions, Release, Run workflow, from main) of an image CI pushed: to
# production, which takes only a commit staging ran (deploy/aws/release.sh checks staging's
# release history), or to staging again, as after a change to its settings. Going back is
# releasing an earlier commit, unless a migration came between. Every commit on main reaches
# staging by itself (ci.yml, Staging); deploying.md, "Releases from CI", has the rest.
name: Release

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Where to release it
        type: choice
        options: [production, staging]
        required: true
      commit:
        description: The commit on main, by its SHA as GitHub shows it (seven digits do)
        type: string
        required: true

permissions:
  contents: read

jobs:
  release:
    name: Release (${{ inputs.environment }})
    runs-on: ubuntu-24.04
    # Systems Manager gives the release an hour on the instance (release.sh).
    timeout-minutes: 70
    # The token AWS trades for the environment's release role, which trusts main alone.
    permissions:
      contents: read
      id-token: write
    # One release of an environment at a time, CI's included.
    concurrency:
      group: release-${{ inputs.environment }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Every commit of main, to find the one named.
          fetch-depth: 0
      # The commit's full SHA, the tag CI pushed it under, and the environment's role. The inputs
      # reach the shell as variables, never as text of the script.
      - name: Commit
        id: commit
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          COMMIT: ${{ inputs.commit }}
          STAGING_ROLE: ${{ vars.AWS_STAGING_ROLE }}
          PRODUCTION_ROLE: ${{ vars.AWS_PRODUCTION_ROLE }}
        run: |
          if [[ $GITHUB_REF != refs/heads/main ]]; then
            echo "::error::Run the release from main: AWS trusts no other branch's workflows."
            exit 1
          fi
          case $ENVIRONMENT in
            staging) role=$STAGING_ROLE variable=AWS_STAGING_ROLE ;;
            production) role=$PRODUCTION_ROLE variable=AWS_PRODUCTION_ROLE ;;
          esac
          if [[ -z $role ]]; then
            echo "::error::The repository variable $variable is not set (deploying.md, \"Releases from CI\")."
            exit 1
          fi
          if [[ ! $COMMIT =~ ^[0-9a-f]{7,40}$ ]] ||
            ! sha=$(git rev-parse --verify --quiet "$COMMIT^{commit}"); then
            echo "::error::$COMMIT is not the SHA of a commit in this repository."
            exit 1
          fi
          # CI pushes the images of main's commits alone.
          if ! git merge-base --is-ancestor "$sha" HEAD; then
            echo "::error::$sha is not on main, so CI never pushed its image."
            exit 1
          fi
          echo "Releasing $(git log -1 --format='%h "%s" (%cs)' "$sha") on $ENVIRONMENT."
          {
            echo "sha=$sha"
            echo "role=$role"
          } >>"$GITHUB_OUTPUT"
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ steps.commit.outputs.role }}
          role-session-name: github-${{ github.run_id }}-${{ github.run_attempt }}
          aws-region: ${{ vars.AWS_REGION || 'eu-central-1' }}
      - name: Release
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          SHA: ${{ steps.commit.outputs.sha }}
        run: deploy/aws/release.sh "$ENVIRONMENT" "$SHA"
