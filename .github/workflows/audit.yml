# The dependencies' known vulnerabilities, every morning and on every change to a manifest or a
# lock file. CI runs only when the code changes, so it would find an advisory published since at
# the next change; this finds it the day after, and GitHub mails a failed scheduled run to
# whoever last changed the schedule below. Each step is the command a developer runs (CLAUDE.md,
# "Commands"); Dependabot (.github/dependabot.yml) proposes the updates that fix most findings.
name: Audit

on:
  schedule:
    - cron: "17 5 * * *"
  push:
    branches: [main]
    paths: &locks
      - backend/pyproject.toml
      - backend/uv.lock
      - frontend/package.json
      - frontend/pnpm-lock.yaml
      - frontend/pnpm-workspace.yaml
      - .github/workflows/audit.yml
  pull_request:
    paths: *locks
  workflow_dispatch:

# The audits read the lock files and ask the advisory databases: no step writes to the
# repository, holds a secret or reaches a deployment.
permissions:
  contents: read

concurrency:
  group: audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python:
    name: Python
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # pip-audit is the backend's `audit` dependency group, so the lock pins it and every
      # package it brings; installing it is all this job does, which needs no cache.
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: 0.11.15
          enable-cache: false
      # Every package the lock holds, the development tools' and pip-audit's own included, asked
      # of OSV (the Python advisories and GitHub's). pip-audit cannot tell a high from a low, so
      # any known one fails: fix it with an update, or accept it here with `--ignore-vuln ID` and
      # a comment that gives the reason. Bash's pipefail: a failed export fails the step.
      - name: Audit
        shell: bash
        run: >-
          uv --directory backend export --locked --all-groups --no-emit-project --quiet |
          uv --directory backend run --locked --only-group audit pip-audit --disable-pip --strict
          --requirement /dev/stdin --vulnerability-service osv --progress-spinner off

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The pnpm and Node the image builds the frontend with (Dockerfile). The audit reads the
      # lock file alone: nothing is installed.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.2.2
          package_json_file: frontend/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # The development dependencies too (the dev server, the compiler), against the registry's
      # advisories. High and critical fail; an accepted one goes into pnpm-workspace.yaml's
      # auditConfig.ignoreGhsas (`pnpm audit --ignore GHSA-…` writes it) with a comment that
      # gives the reason. Never pass --ignore here: it records, it does not filter.
      - name: Audit
        run: pnpm audit --audit-level high
