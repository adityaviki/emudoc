# The known vulnerabilities of the dependencies, of the image and of the images the deployment
# runs beside it, every Monday morning and once a change to a manifest, a lock file, the
# Dockerfile or the deployment's compose files is on main (every morning, and on pull requests
# too, until 2026-10-31: weekly while the app is in development, as Dependabot proposes its
# updates). CI runs only when the code changes, so it would find an advisory published since at
# the next change; this finds it within the week, and GitHub mails a failed scheduled run to
# whoever last changed the schedule below. Each step is the command a
# developer runs (CLAUDE.md, "Commands"); Dependabot (.github/dependabot.yml) proposes the
# updates that fix most findings.
name: Audit

on:
  schedule:
    - cron: "17 5 * * 1"
  push:
    branches: [main]
    paths:
      - backend/pyproject.toml
      - backend/uv.lock
      - frontend/package.json
      - frontend/pnpm-lock.yaml
      - frontend/pnpm-workspace.yaml
      - Dockerfile
      - .dockerignore
      - .trivyignore.yaml
      - deploy/compose.yml
      - deploy/aws/compose.yml
      - deploy/.trivyignore.yaml
      - .github/workflows/audit.yml
  workflow_dispatch:

# The audits read the lock files and ask the advisory databases: no step writes to the
# repository, holds a secret or reaches a deployment.
permissions:
  contents: read

concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: false

env:
  # CI's (ci.yml); .github/scripts/check-versions.sh holds the two to one image.
  TRIVY: aquasec/trivy:0.73.0@sha256:7cced7cae583819fc7806d4cbc0dbbc7cad18b99f7d3e235192e6da8c091045c

jobs:
  python:
    name: Python dependencies
    # This machine's runners (ci-runner) while the repository variable RUNNER names
    # their label, else GitHub's; a pull request of Dependabot's always runs on GitHub's,
    # since what it brings in is nobody's code here yet. The other jobs run where this
    # one does.
    runs-on: &runner ${{ github.actor != 'dependabot[bot]' && vars.RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # pip-audit is the backend's `audit` dependency group, so the lock pins it and every
      # package it brings; installing it is all this job does, which needs no cache.
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: 0.11.15
          enable-cache: false
      # Every package the lock holds, the development tools' and pip-audit's own included, asked
      # of OSV (the Python advisories and GitHub's). pip-audit cannot tell a high from a low, so
      # any known one fails: fix it with an update, or accept it here with `--ignore-vuln ID` and
      # a comment that gives the reason. Bash's pipefail: a failed export fails the step.
      - name: Audit
        shell: bash
        run: >-
          uv --directory backend export --locked --all-groups --no-emit-project --quiet |
          uv --directory backend run --locked --only-group audit pip-audit --disable-pip --strict
          --requirement /dev/stdin --vulnerability-service osv --progress-spinner off

  frontend:
    name: Frontend dependencies
    runs-on: *runner
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The pnpm and Node the image builds the frontend with (Dockerfile). The audit reads the
      # lock file alone: nothing is installed.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.2.2
          package_json_file: frontend/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # The development dependencies too (the dev server, the compiler), against the registry's
      # advisories. High and critical fail; an accepted one goes into pnpm-workspace.yaml's
      # auditConfig.ignoreGhsas (`pnpm audit --ignore GHSA-…` writes it) with a comment that
      # gives the reason. Never pass --ignore here: it records, it does not filter.
      - name: Audit
        run: pnpm audit --audit-level high

  # The image a release builds from this commit, its bases pinned (Dockerfile): Debian's packages
  # and the backend's environment against trivy's database, downloaded fresh each run, and the
  # files for keys. A rebuild every morning is what finds a fixed vulnerability in a base that
  # has not moved; the fix is Dependabot's pull request with the rebuilt base's digest, or the
  # package's update. High and critical with a fix released fail; one without a fix cannot be
  # acted on and is left out (--ignore-unfixed). An accepted one goes into .trivyignore.yaml's
  # vulnerabilities with a statement.
  image:
    name: Image vulnerabilities
    runs-on: *runner
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        run: docker build -t "emudoc:$GITHUB_SHA" .
      - name: Audit
        run: >-
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/src:ro" -w /src
          "$TRIVY" image --quiet --skip-version-check --scanners vuln,secret --severity
          HIGH,CRITICAL --ignore-unfixed --table-mode detailed --exit-code 1
          --ignorefile .trivyignore.yaml "emudoc:$GITHUB_SHA"

  # The images the deployment runs beside the app (ClamAV, llama.cpp, Caddy), each at the digest
  # the compose files pin, by the same scan. Only their projects can fix what it finds: the fix
  # is a newer tag or a rebuild, which Dependabot proposes (the `compose` group). Until one is
  # released, a finding is accepted in deploy/.trivyignore.yaml with a statement and an
  # expired_at, after which it fails here again unless the release has come. trivy reads each
  # image from its registry for the instance's platform, layer by layer, rather than from a
  # copy pulled into Docker, so that no image is unpacked on the runner's disk.
  beside:
    name: Images beside the app
    runs-on: *runner
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # What trivy found in each layer, kept from one run to the next: a layer never changes
      # under its digest, so only a new image's are downloaded and read again (llama.cpp's
      # 300 MB, rebuilt every day, take seconds), and the database, downloaded fresh beside them,
      # is matched against what was kept. A new trivy computes keys of its own and reads the
      # layers again.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/trivy/fanal
          key: trivy-layers-${{ hashFiles('deploy/compose.yml', 'deploy/aws/compose.yml', '.github/workflows/audit.yml') }}
          restore-keys: trivy-layers-
      # The compose files name the images, those behind a profile too; to be read they need a
      # settings file, the app's image (left out of the list), the database's password, Caddy's
      # domain and what Alertmanager is told. trivy runs as the runner's user, so
      # that the cache can save what it wrote, and is given 20 minutes: an image of gigabytes
      # (Ollama's, until October 2026) outlasted its five-minute default on a slower line than a
      # runner's.
      - name: Audit
        shell: bash
        env:
          EMUDOC_ENV: /dev/null
          EMUDOC_IMAGE: emudoc:app
          POSTGRES_PASSWORD: unused
          EMUDOC_DOMAIN: example.org
          EMUDOC_ENVIRONMENT: audit
          EMUDOC_ALERTS: arn:aws:sns:eu-central-1:123456789012:alerts
          EMUDOC_PAGES: arn:aws:sns:eu-central-1:123456789012:pages
          EMUDOC_HEARTBEAT: arn:aws:sns:eu-central-1:123456789012:heartbeat
        run: |
          images=$(
            docker compose -f deploy/compose.yml -f deploy/aws/compose.yml --profile '*' config --images |
              grep -vxF "$EMUDOC_IMAGE" | sort -u
          )
          mkdir -p "$RUNNER_TEMP/trivy"
          failed=()
          for image in $images; do
            echo "$image"
            docker run --rm --user "$(id -u):$(id -g)" -v "$RUNNER_TEMP/trivy:/cache" \
              -v "$PWD:/src:ro" -w /src "$TRIVY" image --cache-dir /cache --timeout 20m \
              --quiet --skip-version-check --image-src remote --platform linux/amd64 \
              --scanners vuln,secret --severity HIGH,CRITICAL --ignore-unfixed \
              --table-mode detailed --exit-code 1 --ignorefile deploy/.trivyignore.yaml \
              "$image" || failed+=("${image%%@*}")
          done
          if ((${#failed[@]})); then
            echo "::error::A high or critical vulnerability with a fix, or a failed scan, in ${failed[*]}"
            exit 1
          fi
