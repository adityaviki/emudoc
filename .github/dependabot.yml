# Pull requests that move the dependencies to their newer releases, once a week, after a week's
# wait: a release that turns out to be malicious is usually pulled within days. CI checks each
# pull request like any other, and the audit workflow those that change a lock file, the
# Dockerfile or the deployment's compose files. Minor and patch updates come as one pull request
# per ecosystem, a major one alone.
#
# Not here: the versions of uv, pnpm, Node and Python, named in the
# Dockerfile and the workflows, move by hand (below, only the digests of Node's and Python's
# tags move); .github/scripts/check-versions.sh fails when they disagree. uv's image, copied
# from in the Dockerfile rather than built from, is one Dependabot does not read.
version: 2

updates:
  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    cooldown:
      default-days: 7
    groups:
      backend:
        patterns: ["*"]
        update-types: [minor, patch]

  # pnpm's lock file. Dependabot's own pnpm is older than the 11 the image and CI run; CI's
  # `pnpm install --frozen-lockfile` is the check that pnpm 11 takes the lock file it writes.
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    cooldown:
      default-days: 7
    groups:
      frontend:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # Node's types follow the Node the frontend is built with (24, the Dockerfile's).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  # The actions in .github/workflows, pinned by commit: an update moves the commit and the tag
  # in its comment together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  # The image's bases (Dockerfile) and the compose files'
  # images, each pinned by digest. An update is the digest a tag was rebuilt with (Debian's security
  # updates, ClamAV's signatures) or a newer tag with its own. These two ecosystems take one
  # cooldown in days for both (the semver-*-days options make the whole file invalid, and Dependabot
  # then runs nothing at all), and a digest's counts from the tag's last push: these tags are pushed
  # every week or two, so a week's wait could hold a rebuilt base back for good. Hence a day, the
  # least it takes, for a newer tag too. A major release is an upgrade to plan, not an update (a
  # Postgres, a Node, Caddy 3), and Python's minor too: 3.14 is another interpreter. One pull
  # request per ecosystem, without update-types, which would leave a digest out: Dependabot groups
  # by the version that changes, and a digest changes none.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    cooldown:
      default-days: 1
    groups:
      images:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      - dependency-name: python
        update-types: ["version-update:semver-minor"]

  # docker-compose.yml (the development database, the profiles) and deploy/compose.yml (Postgres,
  # ClamAV, llama.cpp's server and Caddy beside the app). llama.cpp's `server` tag is its
  # daily build: each Monday proposes that morning's digest, as the cooldown reads push dates from
  # Docker Hub alone, and CI's Embeddings job checks it.
  - package-ecosystem: docker-compose
    directories: [/, /deploy]
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    cooldown:
      default-days: 1
    groups:
      compose:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
