name: Idea
description: Something Emudoc could do, or do better.
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: What you are trying to do
      description: The work you do with your documents, and where Emudoc gets in the way or falls short.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
      description: How you picture it working. Rough is fine.
  - type: textarea
    id: meanwhile
    attributes:
      label: What you do meanwhile
      description: How you work around it today, if you do.
