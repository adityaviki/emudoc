# The development database, for this machine only. It is published on the loopback address,
# so nothing else can reach it, and its password is the well-known `emudoc` on purpose, so
# that `cp .env.example .env` works. The app has no such default: a deployment runs its own
# database and names it in DATABASE_URL.
services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: emudoc
      POSTGRES_PASSWORD: emudoc
      POSTGRES_DB: emudoc
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5437}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U emudoc -d emudoc"]
      interval: 5s
      timeout: 3s
      retries: 10


  # An S3-compatible bucket for trying STORAGE_URL=s3://emudoc by hand; nothing starts it unless
  # asked: `docker compose --profile s3 up -d --wait`. versitygw serves a directory as buckets,
  # so the `emudoc` bucket is a folder made before it starts. Then in .env:
  #   STORAGE_URL=s3://emudoc  AWS_ENDPOINT_URL=http://127.0.0.1:9000  AWS_DEFAULT_REGION=us-east-1
  #   AWS_ACCESS_KEY_ID=emudoc  AWS_SECRET_ACCESS_KEY=emudoc-secret
  # The tests never need it: they run the bucket storage against a fake.
  s3:
    image: versity/versitygw
    profiles: ["s3"]
    entrypoint: ["sh", "-c", "mkdir -p /data/emudoc && exec versitygw posix /data"]
    environment:
      ROOT_ACCESS_KEY: emudoc
      ROOT_SECRET_KEY: emudoc-secret
    ports:
      - "127.0.0.1:${S3_PORT:-9000}:7070"
    volumes:
      - s3data:/data

  # ClamAV, for trying SCANNER_URL=clamd://127.0.0.1:3310 by hand; nothing starts it unless
  # asked: `docker compose --profile clamav up -d --wait`. The first start downloads the
  # signatures (a few hundred megabytes) and the daemon needs a minute and about a gigabyte of
  # memory to load them; the health check turns green once it answers. The limits below let it
  # scan a file as large as MAX_UPLOAD_MB; raise them together. The tests never need it: they
  # run the pipeline against a fake scanner, and the clamd client against a fake daemon.
  clamav:
    image: clamav/clamav:stable
    profiles: ["clamav"]
    environment:
      CLAMD_CONF_StreamMaxLength: 100M
      CLAMD_CONF_MaxFileSize: 100M
      CLAMD_CONF_MaxScanSize: 400M
    ports:
      - "127.0.0.1:${CLAMAV_PORT:-3310}:3310"
    volumes:
      - clamdb:/var/lib/clamav

  # pgbouncer in transaction mode in front of the database, for trying DATABASE_POOLER by hand;
  # nothing starts it unless asked: `docker compose --profile pgbouncer up -d --wait`. It hands
  # out a server connection per transaction and, like pgbouncer before 1.21, carries no
  # prepared statement over (max_prepared_statements 0). Then in .env:
  #   DATABASE_URL=postgresql+psycopg://emudoc:emudoc@127.0.0.1:6438/emudoc
  #   DATABASE_POOLER=transaction
  #   DATABASE_LISTEN_URL=postgresql+psycopg://emudoc:emudoc@127.0.0.1:5437/emudoc
  # The suite runs through it too, with TEST_DATABASE_SERVER=emudoc:emudoc@127.0.0.1:6438 and
  # the same two settings, the listener's naming emudoc_test.
  pgbouncer:
    image: edoburu/pgbouncer:v1.26.0-p0
    profiles: ["pgbouncer"]
    environment:
      DB_HOST: db
      DB_USER: emudoc
      DB_PASSWORD: emudoc
      AUTH_TYPE: scram-sha-256
      POOL_MODE: transaction
      MAX_PREPARED_STATEMENTS: "0"
      DEFAULT_POOL_SIZE: "20"
      MAX_CLIENT_CONN: "500"
    ports:
      - "127.0.0.1:${PGBOUNCER_PORT:-6438}:5432"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U emudoc -d emudoc"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  s3data:
  clamdb:
