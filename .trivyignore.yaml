# What `trivy config` reports of the deployment and the image that was looked at and accepted,
# each with its reason (CI, "Deployment"), and what `trivy image` reports of the image (Audit).
# A new finding fails the check until it is changed or added here with a reason of its own; an
# entry whose reason no longer holds is removed.

secrets:
  - id: gcp-service-account
    paths: ["/app/backend/.venv/lib/python3.13/site-packages/anthropic/**"]
    statement: >-
      No key: the Anthropic SDK's docstrings (from 1.15) say that an agent's execution identity
      may be sent as `{"type": "service_account"}`, the phrase the rule looks for in a Google
      service account's key file. Only the SDK's own files are passed over.

misconfigurations:
  - id: AWS-0104
    paths: [deploy/aws/modules/environment/network.tf]
    statement: >-
      The instance reaches the model providers, the image registries, ClamAV's signature
      mirrors, the embedding model's weights on Hugging Face, SES and the AWS APIs, whose
      addresses move; an allowlist needs an egress proxy that names hosts, not a security group
      of addresses.

  - id: AWS-0132
    paths: [deploy/aws/modules/environment/bucket.tf]
    statement: >-
      The documents are encrypted at rest with S3's own keys (AES256, which the app reports at
      start). A customer-managed key adds a key policy, a request to KMS per object and a cost;
      it comes with 4.3's customer-managed keys.

  - id: AWS-0033
    paths: [deploy/aws/account/main.tf]
    statement: >-
      ECR encrypts the images with its own key (AES256); an image holds the code and no setting,
      key or document.

  - id: AWS-0032
    paths: [deploy/aws/account/main.tf]
    statement: >-
      The repository's policy has one statement, a Deny of the pushes to every principal but
      CI's role (and `pushers`); trivy reads its Principal "*" as public access, which only an
      Allow would give. Nothing outside the account can pull or push.

  - id: AWS-0089
    paths: [deploy/aws/account/main.tf]
    statement: >-
      The state bucket's requests are recorded by the account's trail as data events
      (account/trail.tf), each with the principal that made it, rather than by server access
      logs; and a state cannot be read without decrypting it with alias/emudoc-state, every use
      of which the trail records too.

  - id: AWS-0089
    paths: [deploy/aws/account/trail.tf, deploy/aws/modules/environment/logs.tf]
    statement: >-
      The buckets the logs go to are the end of the line: logging their requests would need
      another bucket whose own went unlogged, and S3 warns against a bucket logging into
      itself. The trail's files are signed and read through the trail's key, every use of
      which the trail records; no role of the app's reaches the environment's logs.

  - id: AWS-0090
    paths: [deploy/aws/account/trail.tf, deploy/aws/modules/environment/logs.tf]
    statement: >-
      Logs are written once, never changed, and expire by a rule: unversioned, an expired log
      is gone, as the privacy policy says of the environment's access and flow logs
      (ACCESS_LOG_DAYS). A trail file removed or changed is found by `aws cloudtrail
      validate-logs` through the digest files that chain them; versions would not keep one
      from an administrator, who may delete those too.

  - id: AWS-0078
    paths: [deploy/aws/modules/environment/database.tf]
    statement: >-
      Database Insights' data is encrypted with RDS's AWS-managed key, as the database is; it
      holds the load and the app's statements with $1 for every value, never a row. A
      customer-managed key comes with 4.3's customer-managed keys.

  - id: AWS-0132
    paths: [deploy/aws/modules/environment/logs.tf]
    statement: >-
      S3 delivers server access logs only to a bucket encrypted with its own keys (SSE-S3); a
      bucket with a KMS key as its default would be sent logs no one could read.

  - id: AWS-0143
    paths: [deploy/aws/modules/environment/mail.tf]
    statement: >-
      SES's SMTP password can only be made from an IAM user's access key, so the mail relay's
      credentials need a user; its one policy allows sending mail from the domain and nothing
      else.

  - id: AWS-0176
    paths: [deploy/aws/modules/environment/database.tf]
    statement: >-
      The app signs in with a password from SSM over TLS checked against RDS's authority
      (verify-full). IAM tokens last 15 minutes, so every new pooled connection would need one
      made first, which neither the pool nor the listener does.

  - id: AWS-0177
    paths: [deploy/aws/modules/environment/database.tf]
    statement: >-
      Deletion protection is the root's choice: production sets it (with a final snapshot),
      staging does not, so that it can be destroyed and built again.

  - id: DS-0026
    paths: [Dockerfile]
    statement: >-
      One image runs the API, the worker, the migrations and the maintenance commands, each
      healthy in its own way, so the compose files give each service its check
      (deploy/compose.yml, deploy/aws/compose.yml).
