# Three self-hosted runners on a developer's machine, which CI and Audit run on while the
# repository variable RUNNER names their label (CLAUDE.md, "CI on this machine"): GitHub's own
# runners are paid for by the minute past the free plan's 2,000 a month, these are not.
#
# Each runner is a pair: the runner (Dockerfile) and a Docker daemon of its own (docker:dind),
# whose network the runner shares, so that what a job publishes on 127.0.0.1 (the compose
# database on 5437, pgbouncer on 6438, the image's smoke test) is the job's alone, and nothing
# a job starts reaches the machine's own Docker: CI's `docker compose up` is project `emudoc`,
# the name of a checkout's own development database. The work directory is the same volume at
# the same path in both, so that a job's `docker run -v "$PWD:…"` mounts its checkout. The
# daemon is privileged, as Docker in Docker must be: what runs here is this repository's code
# from main, never a Dependabot pull request's, which the workflows keep on GitHub's runners.
#
#   # once, or after `down -v`: register the runners with a token that lasts an hour
#   RUNNER_TOKEN=$(gh api -X POST repos/emudocai/emudoc/actions/runners/registration-token --jq .token) \
#     docker compose -f ci-runner/compose.yml up -d --build
#   gh variable set RUNNER --repo emudocai/emudoc --body emudoc    # the workflows use them
#   gh variable delete RUNNER --repo emudocai/emudoc               # back to GitHub's runners
#   docker compose -f ci-runner/compose.yml logs -f runner-1       # a runner's jobs
#   docker compose -f ci-runner/compose.yml up -d --build          # after a change here
#
# They restart with Docker at boot. While this machine is off or the runners are stopped, a
# job waits in the queue (up to a day) for one: delete the variable to run on GitHub's instead.
# Below a game or anything else busy, CI takes what is left (cpu_shares): slower, not in the way.
name: emudoc-runner

x-daemon: &daemon
  image: docker:29.9.2-dind@sha256:9e79b879b177fbd72c34376a3dd3d91747da5db49e1f560f76aea59561471977
  privileged: true
  restart: unless-stopped
  cpu_shares: 256
  # A Unix socket alone, no TCP listener: one at /var/run/docker.sock, where a job's
  # `-v /var/run/docker.sock:…` (trivy's image scan) finds it, and one in the volume the runner
  # mounts, owned by the runner's docker group (Dockerfile's DOCKER_GID).
  command:
    - dockerd
    - --host=unix:///var/run/docker.sock
    - --host=unix:///shared/docker.sock
    - --group=121
  environment:
    DOCKER_TLS_CERTDIR: ""
  # Names are asked of these rather than through Docker Desktop's forwarder, which, two
  # resolvers deep, once answered a burst of pip-audit's lookups with no address.
  dns: [1.1.1.1, 8.8.8.8]
  healthcheck:
    test: ["CMD", "docker", "info"]
    interval: 5s
    timeout: 5s
    retries: 30

x-runner: &runner
  build: .
  image: emudoc-runner
  restart: unless-stopped
  cpu_shares: 256
  environment:
    RUNNER_REPOSITORY: emudocai/emudoc
    RUNNER_LABELS: emudoc
    # Read only by the first start of a runner that is not registered yet (start.sh).
    RUNNER_TOKEN: ${RUNNER_TOKEN:-}
    DOCKER_HOST: unix:///run/dind/docker.sock
    ACTIONS_RUNNER_HOOK_JOB_STARTED: /usr/local/lib/runner/clean.sh
    ACTIONS_RUNNER_HOOK_JOB_COMPLETED: /usr/local/lib/runner/clean.sh

services:
  daemon-1:
    <<: *daemon
    volumes: [socket-1:/shared, docker-1:/var/lib/docker, work-1:/home/runner/_work]
  runner-1:
    <<: *runner
    command: [emudoc-1]
    network_mode: service:daemon-1
    depends_on: {daemon-1: {condition: service_healthy}}
    volumes:
      - socket-1:/run/dind
      - runner-1:/opt/actions-runner
      - home-1:/home/runner
      - work-1:/home/runner/_work

  daemon-2:
    <<: *daemon
    volumes: [socket-2:/shared, docker-2:/var/lib/docker, work-2:/home/runner/_work]
  runner-2:
    <<: *runner
    command: [emudoc-2]
    network_mode: service:daemon-2
    depends_on: {daemon-2: {condition: service_healthy}}
    volumes:
      - socket-2:/run/dind
      - runner-2:/opt/actions-runner
      - home-2:/home/runner
      - work-2:/home/runner/_work

  daemon-3:
    <<: *daemon
    volumes: [socket-3:/shared, docker-3:/var/lib/docker, work-3:/home/runner/_work]
  runner-3:
    <<: *runner
    command: [emudoc-3]
    network_mode: service:daemon-3
    depends_on: {daemon-3: {condition: service_healthy}}
    volumes:
      - socket-3:/run/dind
      - runner-3:/opt/actions-runner
      - home-3:/home/runner
      - work-3:/home/runner/_work

volumes:
  socket-1:
  docker-1:
  runner-1:
  home-1:
  work-1:
  socket-2:
  docker-2:
  runner-2:
  home-2:
  work-2:
  socket-3:
  docker-3:
  runner-3:
  home-3:
  work-3:
