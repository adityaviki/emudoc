# What `trivy image` reports of the images the deployment runs beside the app, ClamAV's,
# Ollama's and Caddy's (deploy/compose.yml, deploy/aws/compose.yml), that was looked at and
# accepted until their projects release the fix (Audit, "Images beside the app"). Only those
# projects can fix them, so each entry names the file in the image it was found in (`paths`, as
# trivy prints the target: a binary has no leading slash), which keeps it from accepting the
# same finding in another image; says why it can wait (`statement`); and stops applying at
# `expired_at`, after which the morning run fails again: take the release Dependabot proposes,
# or look again and move the date. An entry whose finding has gone is removed.

vulnerabilities:
  # Caddy 2.11.7 was built on 3 October with Go 1.26.8 and golang.org/x/net 0.59.0; Go 1.26.9
  # and x/net 0.60.0 fixed these on 8 October. Caddy's next release should bring them.
  - id: CVE-2026-78669
    paths: [usr/bin/caddy]
    expired_at: 2026-11-17
    statement: >-
      A peer that floods HTTP/2 SETTINGS frames keeps the edge's CPU busy. It stops the service
      and reads nothing, and the instance, with nothing in front of it, is as open to any other
      flood.

  - id: CVE-2026-78667
    paths: [usr/bin/caddy]
    expired_at: 2026-11-17
    statement: >-
      A Range header reaches the slow code (FileServer, ServeContent) through Caddy's
      file_server alone; deploy/aws/Caddyfile only proxies.

  - id: CVE-2026-97031
    paths: [usr/bin/caddy]
    expired_at: 2026-11-17
    statement: >-
      Caddy offers Encrypted Client Hello only with its `ech` global option, which
      deploy/aws/Caddyfile does not set, so the server never decodes the extension.

  # Ollama 0.40.5's binary. Ollama builds every release with the Go its go.mod names, 1.26.0
  # (February), and with modules as old, so no release brings these fixes until Ollama moves
  # them; the date is when to look at the reason again, which changes with the compose files.
  - &ollama
    id: CVE-2026-25679
    paths: [usr/bin/ollama]
    expired_at: 2027-01-17
    statement: >-
      Ollama listens on the compose network alone, and only the API and the worker send it
      requests: the passages and searches to embed, as JSON. It sends one out, the
      embedding-model service's pull of the model from its registry, over TLS. What is listed
      beside denial of service is code those requests do not run (SSH, the module checksum
      database, HTML and its templates, the image decoders) or code of the pull (certificate
      checks against a misissued certificate, os.Root over the files the pull writes). The rest
      is denial of service in code a request runs, net/http's server and the JSON and text it
      decodes, which a document's text reaches only through the app: at worst Ollama stops
      answering, and the app searches by keywords and retries the embedding stage meanwhile.
  - {<<: *ollama, id: CVE-2026-25681}
