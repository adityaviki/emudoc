# What `trivy image` reports of the images the deployment runs beside the app, ClamAV's,
# llama.cpp's, Caddy's, Prometheus's and Alertmanager's (deploy/compose.yml,
# deploy/aws/compose.yml), that was looked at and
# accepted until their projects release the fix (Audit, "Images beside the app"). Only those
# projects can fix them, so each entry names the file in the image it was found in (`paths`, as
# trivy prints the target: a binary has no leading slash), or for an OS package, which has no
# path, the package and its version (`purls`, without the distribution's qualifiers), which keeps
# it from accepting the same finding in another image; says why it can wait (`statement`); and
# stops applying at
# `expired_at`, after which the morning run fails again: take the release Dependabot proposes,
# or look again and move the date. An entry whose finding has gone is removed.


vulnerabilities:
  # golang.org/x/net 0.62.0 made its HTML parser's joining of text linear; Caddy 2.11.9 holds
  # 0.60.0, Prometheus 3.16.0 and Alertmanager 0.35.0 0.61.0. A crafted page of many short texts
  # between ignored end tags takes the parser quadratic time, so it matters only where one of
  # them parses HTML a peer wrote.
  - id: CVE-2026-78661
    paths: [usr/bin/caddy]
    expired_at: 2026-11-26
    statement: >-
      Caddy parses HTML only in its templates handler, which deploy/aws/Caddyfile does not use:
      it proxies to the app, compresses the pages and limits bodies, passing the app's HTML
      through unread.

  - id: CVE-2026-78661
    paths: [bin/prometheus, bin/promtool, bin/alertmanager, bin/amtool]
    expired_at: 2026-11-26
    statement: >-
      None of them parses HTML: Prometheus scrapes the app's metrics in its text format over the
      compose network (deploy/prometheus/prometheus.yml), Alertmanager takes Prometheus's alerts
      as JSON and publishes them to SNS, and promtool and amtool read the repository's files.
