# What `trivy image` reports of the images the deployment runs beside the app, Postgres's,
# ClamAV's, llama.cpp's and Caddy's (deploy/compose.yml), that was looked at and
# accepted until their projects release the fix (Audit, "Images beside the app"). Only those
# projects can fix them, so each entry names the file in the image it was found in (`paths`, as
# trivy prints the target: a binary has no leading slash), or for an OS package, which has no
# path, the package and its version (`purls`, without the distribution's qualifiers), which keeps
# it from accepting the same finding in another image; says why it can wait (`statement`); and
# stops applying at
# `expired_at`, after which the morning run fails again: take the release Dependabot proposes,
# or look again and move the date. An entry whose finding has gone is removed.


vulnerabilities:
  # golang.org/x/net 0.62.0 made its HTML parser's joining of text linear; Caddy 2.11.9 holds
  # 0.60.0. A crafted page of many short texts between ignored end tags takes the parser
  # quadratic time, so it matters only where Caddy parses HTML a peer wrote.
  - id: CVE-2026-78661
    paths: [usr/bin/caddy]
    expired_at: 2026-11-26
    statement: >-
      Caddy parses HTML only in its templates handler, which deploy/compose.yml's Caddyfile does not use:
      it proxies to the app, compresses the pages and limits bodies, passing the app's HTML
      through unread.

  # zlib 1.3.1's gzwrite and gz_vacate write past a buffer on a crafted stream or a failed write;
  # Debian fixed both in 1:1.3.dfsg+really1.3.1-1+deb13u1 (November 2026), which the image's
  # digest of 2026-11-12 was built just before.
  - id: CVE-2026-76844
    purls: [pkg:deb/debian/zlib1g@1.3.dfsg%2Breally1.3.1-1%2Bb1]
    expired_at: 2026-11-27
    statement: &zlib >-
      Postgres compresses nothing with zlib's gz* file functions, which the two findings are in:
      the database's pages, its WAL and a plain pg_dump go through none of them, and the image
      is rebuilt with Debian's fix within days, which Dependabot proposes.
  - {id: CVE-2026-85091, purls: [pkg:deb/debian/zlib1g@1.3.dfsg%2Breally1.3.1-1%2Bb1], expired_at: 2026-11-27, statement: *zlib}

  # gosu, which the Postgres image's entrypoint runs once to step down from root to the
  # postgres user, is built with Go 1.24.6, and these are that standard library's fixes since:
  # TLS, X.509, HTTP, URLs, mail, MIME, XML and templates.
  - id: CVE-2025-61726
    paths: [usr/local/bin/gosu]
    expired_at: 2027-01-13
    statement: &gosu >-
      gosu reads nothing but its two arguments, the user and the command, calls setgroups,
      setgid and setuid, and executes the command in its place, before the database starts:
      none of the packages these are in is reached, and nothing reaches the container from
      outside the compose network. The Postgres image takes a new gosu when gosu releases one.
  - {id: CVE-2025-61729, paths: [usr/local/bin/gosu], expired_at: 2027-01-13, statement: *gosu}
  - {id: CVE-2025-68121, paths: [usr/local/bin/gosu], expired_at: 2027-01-13, statement: *gosu}
  - {id: CVE-2026-25679, paths: [usr/local/bin/gosu], expired_at: 2027-01-13, statement: *gosu}
