  # Zstandard 1.5.7's decompression can put up to 64 KiB of an earlier decompression's buffer in
  # its output; Debian fixed it in 1.5.7+dfsg-1+deb13u1 (November 2026). Postgres's image holds
  # the library and the command, ClamAV's (its rebuild of 2026-11-27) the library.
  - id: CVE-2026-124851
    purls: [pkg:deb/debian/libzstd1@1.5.7%2Bdfsg-1, pkg:deb/debian/zstd@1.5.7%2Bdfsg-1]
    expired_at: 2026-12-28
    statement: >-
      It needs someone who submits the compressed data and reads what it decompresses to:
      Postgres decompresses only what it wrote itself, and ClamAV answers a verdict alone,
      never what it unpacked from a file. Both images take Debian's fix when rebuilt, which
      Dependabot proposes.

  # gosu, which the Postgres image's entrypoint runs once to step down from root to the
  # postgres user, is built with Go 1.24.6, and these are that standard library's fixes since:
  # TLS, X.509, HTTP, URLs, mail, MIME, XML and templates.
  - id: CVE-2025-61726
    paths: [usr/local/bin/gosu]
    expired_at: 2027-01-13
    statement: &gosu >-
      gosu reads nothing but its two arguments, the user and the command, calls setgroups,
      setgid and setuid, and executes the command in its place, before the database starts:
      none of the packages these are in is reached, and nothing reaches the container from
      outside the compose network. The Postgres image takes a new gosu when gosu releases one.
  - {id: CVE-2025-61729, paths: [usr/local/bin/gosu], expired_at: 2027-01-13, statement: *gosu}
  - {id: CVE-2025-68121, paths: [usr/local/bin/gosu], expired_at: 2027-01-13, statement: *gosu}
