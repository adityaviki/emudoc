# What `trivy image` reports of the images the deployment runs beside the app, ClamAV's,
# llama.cpp's and Caddy's (deploy/compose.yml, deploy/aws/compose.yml), that was looked at and
# accepted until their projects release the fix (Audit, "Images beside the app"). Only those
# projects can fix them, so each entry names the file in the image it was found in (`paths`, as
# trivy prints the target: a binary has no leading slash), which keeps it from accepting the
# same finding in another image; says why it can wait (`statement`); and stops applying at
# `expired_at`, after which the morning run fails again: take the release Dependabot proposes,
# or look again and move the date. An entry whose finding has gone is removed.

vulnerabilities:
  # Caddy 2.11.7 was built on 3 October with Go 1.26.8 and golang.org/x/net 0.59.0; Go 1.26.9
  # and x/net 0.60.0 fixed these on 8 October. Caddy's next release should bring them.
  - id: CVE-2026-78669
    paths: [usr/bin/caddy]
    expired_at: 2026-11-17
    statement: >-
      A peer that floods HTTP/2 SETTINGS frames keeps the edge's CPU busy. It stops the service
      and reads nothing, and the instance, with nothing in front of it, is as open to any other
      flood.

  - id: CVE-2026-78667
    paths: [usr/bin/caddy]
    expired_at: 2026-11-17
    statement: >-
      A Range header reaches the slow code (FileServer, ServeContent) through Caddy's
      file_server alone; deploy/aws/Caddyfile only proxies.

  - id: CVE-2026-97031
    paths: [usr/bin/caddy]
    expired_at: 2026-11-17
    statement: >-
      Caddy offers Encrypted Client Hello only with its `ech` global option, which
      deploy/aws/Caddyfile does not set, so the server never decodes the extension.
