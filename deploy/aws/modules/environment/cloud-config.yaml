#cloud-config
# The instance's first start (instance.tf): Docker with Compose and the registry's credentials
# helper, the host's settings, the release stub and the units around it, then the recorded
# release, if there is one. Everything else on the host comes with each release's image.

packages:
  - docker
  - amazon-ecr-credential-helper
  # In the AMI already; the release needs them.
  - awscli-2
  - findutils

write_files:
  - path: /etc/emudoc/host.env
    permissions: "0644"
    content: |
      ${indent(6, host_env)}
  - path: /usr/local/sbin/emudoc-release
    permissions: "0755"
    content: |
      ${indent(6, release)}
  - path: /usr/local/sbin/emudoc-alert
    permissions: "0755"
    content: |
      ${indent(6, alert)}
  - path: /etc/systemd/system/emudoc-boot.service
    content: |
      [Unit]
      Description=Emudoc: the recorded release, at start
      Wants=network-online.target
      After=network-online.target docker.service emudoc-credentials.service
      Requires=docker.service
      OnFailure=emudoc-alert@%n.service

      [Service]
      Type=oneshot
      ExecStart=/usr/local/sbin/emudoc-release
      TimeoutStartSec=30min

      [Install]
      WantedBy=multi-user.target
  - path: /etc/systemd/system/emudoc-alert@.service
    content: |
      [Unit]
      Description=Emudoc: report %i to the alerts topic

      [Service]
      Type=oneshot
      ExecStart=/usr/local/sbin/emudoc-alert %i
  # Each container's log rotated at 5 × 20 MB, in Docker's compact format.
  - path: /etc/docker/daemon.json
    content: |
      {"log-driver": "local", "log-opts": {"max-size": "20m", "max-file": "5"}}
  # Pulls from the registry with the instance's role; no password is kept.
  - path: /root/.docker/config.json
    permissions: "0600"
    content: |
      {"credHelpers": {"${registry}": "ecr-login"}}

runcmd:
  - [bash, -c, "curl -fsSL --retry 5 -o /tmp/docker-compose https://github.com/docker/compose/releases/download/v${compose_version}/docker-compose-linux-x86_64 && echo '${compose_sha256}  /tmp/docker-compose' | sha256sum --check --quiet && install -D -m 0755 /tmp/docker-compose /usr/local/lib/docker/cli-plugins/docker-compose && rm /tmp/docker-compose"]
  - [systemctl, enable, --now, docker.service]
  - [systemctl, enable, emudoc-boot.service]
  - [systemctl, start, --no-block, emudoc-boot.service]
