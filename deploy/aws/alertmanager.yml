# Alertmanager on the AWS instance (deploy/aws/compose.yml; deploying.md, "Alerts"): what the
# rules of deploy/prometheus fire goes to the environment's alerts topic, and the watchdog,
# which always fires, goes every two minutes to the heartbeat topic, whose silence CloudWatch
# reports (deploy/aws/modules/environment/alerts.tf). It publishes with the Alertmanager role's
# credentials, which the host renews (deploy/aws/host/credentials). Alertmanager reads no
# variable, so its container writes the environment's name and the topics over the words in @
# at each start, from compose.env (deploy/aws/host/settings).
#
#   amtool check-config deploy/aws/alertmanager.yml

route:
  receiver: alerts
  group_by: [alertname]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers: ['alertname="EmudocWatchdog"']
      receiver: heartbeat
      group_wait: 0s
      group_interval: 1m
      repeat_interval: 2m
    - matchers: ['severity="critical"']
      receiver: alerts
      repeat_interval: 1h

# One process that does not answer is said once: "No API has answered" covers the API at its
# address.
inhibit_rules:
  - source_matchers: ['alertname=~"EmudocNoApi|EmudocNoWorker"']
    target_matchers: ['alertname="EmudocProcessDown"']
    equal: [process]

receivers:
  - name: alerts
    sns_configs:
      - topic_arn: "@ALERTS@"
        # SNS takes a subject of one line under 100 characters.
        subject: 'Emudoc @ENVIRONMENT@: {{ .CommonLabels.alertname }}{{ if eq .Status "resolved" }} is over{{ end }}'
        message: |-
          {{ range .Alerts.Firing }}{{ .Labels.severity }}: {{ .Annotations.summary }}
          {{ .Annotations.description }}

          {{ end }}{{ if .Alerts.Resolved }}Over:
          {{ range .Alerts.Resolved }}  {{ .Annotations.summary }}
          {{ end }}
          {{ end }}From Prometheus's rules on the instance (deploy/prometheus/alerts.yml). Its alerts page is http://localhost:9090/alerts after aws ssm start-session --target INSTANCE --document-name AWS-StartPortForwardingSession --parameters portNumber=9090,localPortNumber=9090, INSTANCE being tofu output instance_id.

  - name: heartbeat
    sns_configs:
      - topic_arn: "@HEARTBEAT@"
        send_resolved: false
        subject: "Emudoc @ENVIRONMENT@: heartbeat"
        message: "Prometheus evaluates the alerting rules, and Alertmanager reaches SNS."
