# What deploy/compose.yml needs on the AWS instance (deploying.md, "On AWS"), laid over it by
# the host's release (deploy/aws/host/release), which runs from the image this file came in:
#
#   docker compose --env-file /etc/emudoc/compose.env \
#     -f deploy/compose.yml -f deploy/aws/compose.yml up -d --wait
#
# emudoc-compose on the instance is that command without its last words.

# The app's containers reach the bucket with the app role's credentials, which the host renews
# every quarter of an hour into a directory of its own (deploy/aws/host/credentials): boto3
# runs `cat` for them whenever the ones it holds near their end. The instance's own
# credentials stay out of every container. RDS's authority checks the database's certificate
# (DATABASE_URL's sslrootcert).
x-aws: &aws
  environment:
    AWS_CONFIG_FILE: /run/aws/config
    AWS_EC2_METADATA_DISABLED: "true"
  volumes:
    - /run/emudoc/aws/app:/run/aws:ro
    - /etc/emudoc/rds-ca.pem:/etc/emudoc/rds-ca.pem:ro

services:
  migrate: *aws
  api: *aws
  worker: *aws

  # On the host's network, so that it answers on 80 and 443 and reaches the API where a proxy
  # on the machine would, 127.0.0.1:8000, whose requests come from the gateway that
  # FORWARDED_ALLOW_IPS names.
  caddy:
    image: caddy:2.11.7@sha256:685ae3d7c34d9b5f8caeddc5d14051db7bbd88ff1f5a2fa0c16bd8ca328fb7af
    network_mode: host
    environment:
      EMUDOC_DOMAIN: ${EMUDOC_DOMAIN:?set EMUDOC_DOMAIN to APP_URL's host}
    volumes:
      - ./aws/Caddyfile:/etc/caddy/Caddyfile:ro
      # The certificates and the ACME account, kept across releases.
      - caddy-data:/data
      - caddy-config:/config
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped

volumes:
  caddy-data:
  caddy-config:
