# What deploy/compose.yml needs on the AWS instance (deploying.md, "On AWS"), and Prometheus
# and Alertmanager beside it ("Alerts"), laid over it by the host's release
# (deploy/aws/host/release), which runs from the image this file came in, with the profiles
# scan, office and tls on (host/compose):
#
#   docker compose --env-file /etc/emudoc/compose.env \
#     -f deploy/compose.yml -f deploy/aws/compose.yml up -d --wait
#
# emudoc-compose on the instance is that command without its last words.

# Every container logs to the host's journal, which deletes each line before it is
# SERVER_LOG_DAYS old (host/settings writes the journal's settings, host/release applies them):
# Docker's own drivers rotate by size alone, so a quiet instance would keep months of Caddy's
# access log, every visitor's address in it.
# `emudoc-compose logs` reads it as before, and so does `journalctl
# CONTAINER_NAME=emudoc-deploy-api-1`. A service of either file without it would log where the
# daemon says (cloud-config.yaml); test_deploy.py refuses one.
x-logging: &logging
  driver: journald
  options:
    tag: "{{.Name}}"

# The app's containers reach the bucket with the app role's credentials, which the host renews
# every quarter of an hour into a directory of its own (deploy/aws/host/credentials): boto3
# runs `cat` for them whenever the ones it holds near their end. The instance's own
# credentials stay out of every container. RDS's authority checks the database's certificate
# (DATABASE_URL's sslrootcert).
x-aws: &aws
  environment:
    AWS_CONFIG_FILE: /run/aws/config
    AWS_EC2_METADATA_DISABLED: "true"
  volumes:
    - /run/emudoc/aws/app:/run/aws:ro
    - /etc/emudoc/rds-ca.pem:/etc/emudoc/rds-ca.pem:ro
  logging: *logging

services:
  # RDS is the database (DATABASE_URL in the settings), so the compose file's own is left out;
  # the app's services wait for it only where it runs.
  postgres:
    profiles: [not-on-aws]
    logging: *logging
  migrate: *aws
  api: *aws
  worker: *aws
  # RDS keeps the database's backups and the bucket the files' versions; `run --rm backup`
  # would list the bucket's keys with the app role's credentials, as the worker reaches them.
  backup: *aws
  converter:
    logging: *logging
  clamav:
    logging: *logging
  embedding-model:
    logging: *logging
  embeddings:
    logging: *logging

  # deploy/compose.yml's Caddy, with its configuration, for the domain the release passes in
  # (host/compose turns its profile on, with ClamAV's and the converter's).
  caddy:
    environment:
      APP_URL: https://${EMUDOC_DOMAIN:?set EMUDOC_DOMAIN to APP_URL's host}
    logging: *logging

  # The alerting rules of deploy/prometheus over the metrics of every API and worker, found by
  # the services' names on this network. It holds no credentials. Its page answers on the host's
  # loopback alone, for Session Manager's port forwarding: the metrics never leave the instance.
  prometheus:
    image: prom/prometheus:v3.16.0@sha256:e04987641b57704f408e31f6373ba4138ecf27cb4a165d24aabb6c38fddd0f06
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=2GB
    ports:
      - 127.0.0.1:9090:9090
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:9090/-/ready]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 1m
    logging: *logging
    restart: unless-stopped

  # What Prometheus fires, to the alerts topic and the critical part to the pages topic too, and
  # its watchdog to the heartbeat topic (aws/alertmanager.yml), with the Alertmanager role's
  # credentials. Alertmanager reads no variable, so the environment's name and the topics are
  # written over the words in @ of its configuration at each start. Its web page, for silences,
  # answers on the host's loopback alone.
  alertmanager:
    image: prom/alertmanager:v0.35.0@sha256:e638797febd034838eca8b98cdbd46f951e9bf7f178777aa8669167406a9946c
    entrypoint:
      - /bin/sh
      - -euc
      - >-
        sed -e "s|@ENVIRONMENT@|$$EMUDOC_ENVIRONMENT|g" -e "s|@ALERTS@|$$EMUDOC_ALERTS|g"
        -e "s|@PAGES@|$$EMUDOC_PAGES|g" -e "s|@HEARTBEAT@|$$EMUDOC_HEARTBEAT|g"
        /etc/alertmanager/alertmanager.yml >/tmp/alertmanager.yml;
        exec /bin/alertmanager --config.file=/tmp/alertmanager.yml --storage.path=/alertmanager
        --cluster.listen-address=
    environment:
      AWS_CONFIG_FILE: /run/aws/config
      AWS_EC2_METADATA_DISABLED: "true"
      EMUDOC_ENVIRONMENT: ${EMUDOC_ENVIRONMENT:?set EMUDOC_ENVIRONMENT to the environment's name}
      EMUDOC_ALERTS: ${EMUDOC_ALERTS:?set EMUDOC_ALERTS to the alerts topic's ARN}
      EMUDOC_PAGES: ${EMUDOC_PAGES:?set EMUDOC_PAGES to the pages topic's ARN}
      EMUDOC_HEARTBEAT: ${EMUDOC_HEARTBEAT:?set EMUDOC_HEARTBEAT to the heartbeat topic's ARN}
    # The credentials' group (host/credentials); it runs as nobody.
    group_add: ["10001"]
    ports:
      - 127.0.0.1:9093:9093
    volumes:
      - ./aws/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - /run/emudoc/aws/alertmanager:/run/aws:ro
      # The silences, and what was sent, so that a restart repeats nothing.
      - alertmanager-data:/alertmanager
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:9093/-/ready]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging: *logging
    restart: unless-stopped

volumes:
  prometheus-data:
  alertmanager-data:
