# Emudoc on one machine from its image (deploying.md, "The image"): the release step, the API,
# a worker, and ClamAV and llama.cpp's server for them. The database, the mail relay, the bucket
# if there is one, and the reverse proxy that ends TLS in front of the API are the deployment's
# ("The pieces").
#
#   export EMUDOC_IMAGE=emudoc:$(git rev-parse HEAD)
#   docker compose -f deploy/compose.yml up -d --wait
#
# `up` runs the release step, `alembic upgrade head`, and starts the API and the worker only
# once it has succeeded: the app refuses a database behind its migrations and never upgrades
# one itself. It replaces the running ones before the release step, though, so an update with
# the new image's tag runs the release step alone first and stops if it fails, and so does the
# embeddings server with the download of its weights:
#
#   docker compose -f deploy/compose.yml run --rm --no-deps migrate && \
#     docker compose -f deploy/compose.yml up -d --wait embeddings && \
#     docker compose -f deploy/compose.yml up -d --wait
#
# The operator's commands run beside them with `run --rm --no-deps worker python -m
# app.maintenance …`; without --no-deps, `run` runs the release step first.
#
# The settings are the file EMUDOC_ENV names, /etc/emudoc/emudoc.env unless set: the variables
# of .env.example, readable by root only, and outside the checkout. Compose reads it, not the
# app; it expands $ in a value unless the value is in single quotes.
#   STORAGE_URL=file:///var/lib/emudoc   for the files volume below, or s3://… for a bucket
#   SCANNER_URL=clamd://clamav:3310      the daemon below
#   EMBEDDING_BASE_URL=http://embeddings:8080/v1   the embeddings endpoint below
#
# The API and the worker serve their metrics on 9464 of their containers (the image's
# METRICS_ADDRESS), which nothing below publishes: a scraper on this network asks api:9464 and
# worker:9464, every replica of each by the service's name, as deploy/prometheus/prometheus.yml
# does with the alerting rules beside it (deploying.md, "Metrics" and "Alerts").

# Apart from the development file's project (emudoc), so that one machine can run both.
name: emudoc-deploy

x-app: &app
  image: ${EMUDOC_IMAGE:?set EMUDOC_IMAGE to the image to run, such as emudoc:<commit>}
  env_file: ${EMUDOC_ENV:-/etc/emudoc/emudoc.env}
  # Nothing in the image is written to. Uploads pass through /tmp, and a worker copies an
  # original there to scan, parse and render it, so the tmpfs holds as much as the API takes in
  # at once (MAX_UPLOAD_REQUEST_MB and MAX_UPLOAD_MB again, per concurrent upload) and a worker
  # works on (MAX_UPLOAD_MB per WORKER_CONCURRENCY). It counts as the container's memory.
  read_only: true
  tmpfs:
    - /tmp:size=2g,mode=1777
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  # Where a file:// storage keeps the files, shared by the API and every worker. A bucket
  # needs none.
  volumes:
    - files:/var/lib/emudoc
  restart: unless-stopped

services:
  migrate:
    <<: *app
    command: [alembic, upgrade, head]
    restart: "no"

  api:
    <<: *app
    depends_on:
      migrate:
        condition: service_completed_successfully
      embeddings:
        condition: service_healthy
    # For a proxy on this machine (deploying.md, "TLS at a reverse proxy"). Its requests reach
    # the API from the network's gateway, the only address whose X-Forwarded-For and
    # X-Forwarded-Proto the API believes.
    ports:
      - 127.0.0.1:8000:8000
    environment:
      FORWARDED_ALLOW_IPS: 10.73.0.1
    # A stop ends the answer streams at once, whose pages follow the answers again from the
    # next API, and gives the other requests 8 seconds (--timeout-graceful-shutdown in the
    # image's command) within these 10; raise both together, and add the worker's 8 seconds
    # for an API that runs the worker too (RUN_WORKER=true).
    stop_grace_period: 10s
    # Ready: it reaches the database (deploying.md, "Health checks"). Docker restarts nothing
    # for a failing check; it is what `up --wait` waits for and `ps` shows.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=4)
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  worker:
    <<: *app
    command: [python, -m, app.worker, --alive-file, /tmp/worker.alive]
    # A stop gives the running jobs 8 seconds (--grace) within these 10 and hands the rest
    # back to the queue, for the next worker to start over; raise both together.
    stop_grace_period: 10s
    depends_on:
      migrate:
        condition: service_completed_successfully
      embeddings:
        condition: service_healthy
    # It serves nothing to ask: it touches the file every 10 seconds while all its threads run,
    # and exits, to be restarted, when one has ended. Stuck is a file a minute old, or none.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import os, sys, time; sys.exit(time.time() - os.stat('/tmp/worker.alive').st_mtime > 60)
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  clamav:
    image: clamav/clamav:1.5@sha256:638d90201ee7ee6a82d249a2fc23b132e578673b5f1f2766852b127676ca1ef6
    # Its limits let it scan a file as large as MAX_UPLOAD_MB; raise them together. It needs
    # about a gigabyte of memory, and a minute at start to load the signatures, during which
    # the worker holds uploads in the queue.
    environment:
      CLAMD_CONF_StreamMaxLength: 100M
      CLAMD_CONF_MaxFileSize: 100M
      CLAMD_CONF_MaxScanSize: 400M
    volumes:
      - clamdb:/var/lib/clamav
    restart: unless-stopped

  # Downloads the embedding model's weights into the volume when they are not there yet, and
  # checks them against their SHA-256 first; the file is named by it, so other weights are
  # another file, and the server is started again with them. The default is nomic-embed-text
  # v1.5 at 16 bits as Nomic published it, at a fixed commit (deploying.md, "Beside the
  # app": its vectors are those of Ollama's nomic-embed-text); another model is named with
  # `export EMBEDDING_WEIGHTS_URL=… EMBEDDING_WEIGHTS_SHA256=…` beside EMUDOC_IMAGE, as well as
  # EMBEDDING_MODEL and the rest in the env file. The image is the server's, which has curl.
  embedding-model:
    image: ghcr.io/ggml-org/llama.cpp:server@sha256:f41d47eee678c02656eefc9ed8cce76cab584aa7032805eeef0e6639fcfda485
    environment:
      EMBEDDING_WEIGHTS_URL: ${EMBEDDING_WEIGHTS_URL:-https://huggingface.co/nomic-ai/nomic-embed-text-v1.5-GGUF/resolve/0188c9bf409793f810680a5a431e7b899c46104c/nomic-embed-text-v1.5.f16.gguf}
      EMBEDDING_WEIGHTS_SHA256: &weights ${EMBEDDING_WEIGHTS_SHA256:-f7af6f66802f4df86eda10fe9bbcfc75c39562bed48ef6ace719a251cf1c2fdb}
    entrypoint: [/bin/sh, -c]
    command:
      - |
        set -eu
        weights="/models/$$EMBEDDING_WEIGHTS_SHA256.gguf" part=/models/download.part
        [ -f "$$weights" ] && exit 0
        curl -fsSL --retry 3 -o "$$part" "$$EMBEDDING_WEIGHTS_URL"
        if ! echo "$$EMBEDDING_WEIGHTS_SHA256  $$part" | sha256sum -c --status; then
          rm -f "$$part"
          echo "The file at EMBEDDING_WEIGHTS_URL is not the one EMBEDDING_WEIGHTS_SHA256 names." >&2
          exit 1
        fi
        mv "$$part" "$$weights"
    # As root, the owner of the new volume, but with no capability: it writes there alone.
    volumes:
      - embedding-model:/models
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: "no"

  # The embeddings endpoint (deploying.md, "The embeddings endpoint"): llama.cpp's server, on
  # this network only. It is sent every passage and every search, and sends nothing out. The
  # tag is the daily build (this digest is b11706), which Dependabot proposes each Monday and
  # CI checks against the vectors the deployments hold (.github/scripts/check-embeddings.sh).
  embeddings:
    image: ghcr.io/ggml-org/llama.cpp:server@sha256:f41d47eee678c02656eefc9ed8cce76cab584aa7032805eeef0e6639fcfda485
    depends_on:
      embedding-model:
        condition: service_completed_successfully
    environment:
      EMBEDDING_WEIGHTS_SHA256: *weights
    user: 65534:65534
    entrypoint: [/bin/sh, -c]
    # Embeddings alone, without the chat page or the slots' state, and warnings and errors
    # alone in the log, which otherwise takes lines for every input. The batches hold 8,192
    # tokens, more than any input the app sends (6,000 characters, which nomic-embed-text reads
    # as a token each at most): with the default 512 an input past them is refused as a server
    # error, which the app would try again, where past the model's context (2,048 tokens) it is
    # refused as such, and the app cuts it (app/embeddings.py). The container holds about
    # 500 MB with nomic-embed-text.
    command:
      - >-
        exec /app/llama-server --model "/models/$$EMBEDDING_WEIGHTS_SHA256.gguf" --embeddings
        --batch-size 8192 --ubatch-size 8192 --no-webui --no-slots --log-verbosity 2
    volumes:
      - embedding-model:/models:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, curl, -fsS, -o, /dev/null, http://127.0.0.1:8080/health]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped

# A subnet of its own, so that the gateway the proxy's requests come from is known; change both
# addresses if it collides with a network this machine already reaches.
networks:
  default:
    ipam:
      config:
        - subnet: 10.73.0.0/24
          gateway: 10.73.0.1

volumes:
  files:
  clamdb:
  embedding-model:
