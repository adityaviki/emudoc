# Emudoc on a team's server, from the image published to GHCR (deploying.md, "The image"): the
# database, the release step, the API, a worker and llama.cpp's server for the embeddings, and
# behind a profile each, ClamAV, the converter and Caddy in front. The settings are .env beside
# this file, made from .env.example beside it; the README's "Quick start" is the whole install:
#
#   docker compose up -d --wait
#
# `up` starts the database, runs the release step, `alembic upgrade head`, and starts the API
# and the worker only once it has succeeded: the app refuses a database behind its migrations
# and never upgrades one itself. It replaces the running ones before the release step, though,
# so an update to a new EMUDOC_TAG runs the release step alone first and stops if it fails,
# and so does the embeddings server with the download of its weights, after a backup to go back
# to (deploying.md, "Upgrades"):
#
#   docker compose run --rm backup && docker compose pull && docker compose run --rm migrate && \
#     docker compose up -d --wait embeddings && docker compose up -d --wait
#
# The operator's commands run beside them with `run --rm --no-deps worker python -m
# app.maintenance …`; without --no-deps, `run` runs the release step first. `run --rm backup`
# writes a backup of the database and the files, every night from a timer ("Backups").
#
# .env is read twice: Compose fills this file's ${…} from it (POSTGRES_PASSWORD, APP_URL,
# EMUDOC_TAG, EMUDOC_BACKUPS, COMPOSE_PROFILES), and the app's containers take every line of
# it as their environment (EMUDOC_ENV names another file for that). Compose expands $ in a
# value unless the value is in single quotes.
#
# The profiles, named in COMPOSE_PROFILES in .env or with --profile:
#   scan     ClamAV, which scans every upload; with SCANNER_URL=clamd://clamav:3310 in .env
#            (never without the profile: a scanner named and not running holds every upload)
#   office   the converter, which shows Word, PowerPoint, Excel, RTF and HTML files as they look;
#            with CONVERTER_URL=http://converter:8080
#   tls      Caddy, which answers on 80 and 443 for APP_URL's name with a certificate from Let's
#            Encrypt; without it, a proxy of the server's own forwards to 127.0.0.1:8000
#
# The API and the worker serve their metrics on 9464 of their containers (the image's
# METRICS_ADDRESS), which nothing below publishes: a scraper on this network asks api:9464 and
# worker:9464, every replica of each by the service's name, as deploy/prometheus/prometheus.yml
# does with the alerting rules beside it (deploying.md, "Metrics" and "Alerts").

# Apart from the development file's project (emudoc), so that one machine can run both.
name: emudoc-deploy

x-image: &image ${EMUDOC_IMAGE:-ghcr.io/adityaviki/emudoc:${EMUDOC_TAG:-latest}}

x-app: &app
  image: *image
  env_file: ${EMUDOC_ENV:-.env}
  # Nothing in the image is written to. Uploads pass through /tmp, and a worker copies an
  # original there to scan, parse and render it, so the tmpfs holds as much as the API takes in
  # at once (MAX_UPLOAD_REQUEST_MB and MAX_UPLOAD_MB again, per concurrent upload, and from a
  # bucket the RENDER_CACHE_MB of originals it keeps for drawing pages) and a worker works on
  # (MAX_UPLOAD_MB per WORKER_CONCURRENCY, 1.6 GB at the defaults). It counts as the
  # container's memory.
  read_only: true
  tmpfs:
    - /tmp:size=2g,mode=1777
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  # Where a file:// storage keeps the files, shared by the API and every worker. A bucket
  # needs none.
  volumes:
    - files:/var/lib/emudoc
  restart: unless-stopped

# The database first, then the release step, and the embeddings server downloaded and started,
# before the API or a worker. The database's need is not required, so that a deployment with a
# database of its own, such as a managed one, may leave the service out by an override.
x-ready: &ready
  postgres:
    condition: service_healthy
    required: false
  migrate:
    condition: service_completed_successfully
  embeddings:
    condition: service_healthy

# Caddy's configuration, as deploying.md's "Caddy" gives it, with APP_URL for the name: the
# query cut from the access log, the body limits, and the page's files compressed. A $ is
# written $$ here, where Compose would read it. It reaches Caddy as a variable, which the
# container writes to its tmpfs: Compose's own configs cannot enter a read-only container.
x-caddyfile: &caddyfile |
  {$$APP_URL} {
  	# Caddy keeps no access log without this block; with it, the query is cut from each
  	# address, since it carries a search's words ("Logs" in deploying.md).
  	log {
  		format filter {
  			wrap json
  			fields {
  				request>uri regexp \?.*$$ ?…
  			}
  		}
  	}
  	# The upload routes alone, the page's and the versioned API's, take a large body,
  	# MAX_UPLOAD_REQUEST_MB (500 by default); the proxy refuses a larger one before the app
  	# has read it. Every other request is small.
  	@uploads path_regexp ^/api/(v1/)?projects/[0-9]+/documents$$
  	request_body @uploads {
  		max_size 500MB
  	}
  	@others not path_regexp ^/api/(v1/)?projects/[0-9]+/documents$$
  	request_body @others {
  		max_size 1MB
  	}
  	# The page's own files compressed, the script to a third of its size; the API's answers
  	# as the app sends them, an answer's events among them.
  	@page not path /api /api/*
  	encode @page gzip
  	# Each request's id, which Caddy's access log names `uuid` and the app's lines
  	# `request_id`; one the browser sent is replaced ("Logs" in deploying.md).
  	reverse_proxy 127.0.0.1:8000 {
  		header_up X-Request-ID {http.request.uuid}
  	}
  }

services:
  # Postgres 17 with pgvector, as the app needs it (deploying.md, "The database"), on this
  # network alone: the app reaches it as postgres, which counts as the deployment's own network,
  # so without TLS (DATABASE_URL in .env). The role's two limits are the server's, so that a
  # query that runs away or a transaction left open ends ("The role's timeouts"); the
  # migrations and the long housekeeping lift them for their own transactions. The backups are
  # "Backups" in deploying.md.
  postgres:
    image: pgvector/pgvector:0.8.7-pg17-trixie@sha256:89947206f52eac3a9df9b663df7e76987cbdc623be6576b3a524953d568700d7
    environment:
      POSTGRES_USER: emudoc
      POSTGRES_DB: emudoc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env, as openssl rand -hex 24 makes one}
    command:
      - postgres
      - -c
      - statement_timeout=30s
      - -c
      - idle_in_transaction_session_timeout=5min
    volumes:
      - database:/var/lib/postgresql/data
    # A stop lets it finish writing; it then starts without recovering.
    stop_grace_period: 1m
    healthcheck:
      test: [CMD-SHELL, pg_isready -U emudoc -d emudoc]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5
    restart: unless-stopped

  migrate:
    <<: *app
    command: [alembic, upgrade, head]
    depends_on:
      postgres:
        condition: service_healthy
        required: false
    restart: "no"

  api:
    <<: *app
    depends_on: *ready
    # For a proxy on this machine, Caddy below or the server's own (deploying.md, "TLS at a
    # reverse proxy"). Its requests reach the API from the network's gateway, the only address
    # whose X-Forwarded-For and X-Forwarded-Proto the API believes.
    ports:
      - 127.0.0.1:8000:8000
    environment:
      FORWARDED_ALLOW_IPS: 10.73.0.1
    # A stop ends the answer streams at once, whose pages follow the answers again from the
    # next API, and gives the other requests 8 seconds (--timeout-graceful-shutdown in the
    # image's command) within these 10; raise both together, and add the worker's 8 seconds
    # for an API that runs the worker too (RUN_WORKER=true).
    stop_grace_period: 10s
    # Ready: it reaches the database (deploying.md, "Health checks"). Docker restarts nothing
    # for a failing check; it is what `up --wait` waits for and `ps` shows.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=4)
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  worker:
    <<: *app
    command: [python, -m, app.worker, --alive-file, /tmp/worker.alive]
    # The converter's network as well, which nothing else of the app is on.
    networks: [default, converter]
    # A stop gives the running jobs 8 seconds (--grace) within these 10 and hands the rest
    # back to the queue, for the next worker to start over; raise both together.
    stop_grace_period: 10s
    depends_on: *ready
    # It serves nothing to ask: it touches the file every 10 seconds while all its threads run,
    # and exits, to be restarted, when one has ended. Stuck is a file a minute old, or none.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import os, sys, time; sys.exit(time.time() - os.stat('/tmp/worker.alive').st_mtime > 60)
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  # The backups (deploying.md, "Backups"), with a profile of its own, which `run` names: each
  # run writes the database and the files into a new folder of the backups volume, or of the
  # directory EMUDOC_BACKUPS names in .env (one uid 10001 may write in, off this disk at best),
  # and removes those older than BACKUP_DAYS. A restore, with the app stopped and the database
  # empty, is `run --rm backup python -m app.maintenance restore /backups/<folder>`. It reaches
  # the database and the files as the worker does, and nothing else.
  backup:
    <<: *app
    profiles: [backup]
    command: [python, -m, app.maintenance, backup, /backups]
    depends_on:
      postgres:
        condition: service_healthy
        required: false
    volumes:
      - files:/var/lib/emudoc
      - ${EMUDOC_BACKUPS:-backups}:/backups
    restart: "no"

  # The converter (deploying.md, "The converter"), with the office profile: the image run as a
  # container of its own with LibreOffice, which turns a Word, PowerPoint, Excel, RTF or HTML
  # upload into the PDF the document pane shows it by. LibreOffice reads every such upload, and
  # a document can name files and addresses for it to fetch, so it is given no settings (no
  # env_file), no volume and no network but `converter`, which the worker alone shares and which
  # leads nowhere else. Its limits: --timeout seconds a file, --concurrency at once, --max-mb as
  # large as MAX_UPLOAD_MB (raise them together), and the memory below, past which the kernel
  # ends the conversion and the worker gives the file up after its tries.
  converter:
    image: *image
    profiles: [office]
    command: [python, -m, app.converter, --concurrency, "2", --timeout, "120", --max-mb, "100"]
    networks: [converter]
    read_only: true
    tmpfs:
      - /tmp:size=1g,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 2g
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=4)
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    restart: unless-stopped

  # ClamAV, with the scan profile: Debian's build, which ClamAV publishes for arm64 as well as
  # amd64. Its limits let it scan a file as large as MAX_UPLOAD_MB; raise them together. It
  # needs about a gigabyte of memory, and a minute at start to load the signatures, during which
  # the worker holds uploads in the queue.
  clamav:
    image: clamav/clamav-debian:1.5@sha256:76a9c3b63764b78178dc68fa7efcceca0cde2c8c9d4f925a8e697cb4511f8fdc
    profiles: [scan]
    environment:
      CLAMD_CONF_StreamMaxLength: 100M
      CLAMD_CONF_MaxFileSize: 100M
      CLAMD_CONF_MaxScanSize: 400M
    volumes:
      - clamdb:/var/lib/clamav
    restart: unless-stopped

  # Downloads the embedding model's weights into the volume when they are not there yet, and
  # checks them against their SHA-256 first; the file is named by it, so other weights are
  # another file, and the server is started again with them. The default is Google's
  # EmbeddingGemma 300M at 8 bits as llama.cpp's own organisation published it, at a fixed
  # commit, under the Gemma Terms of Use (deploying.md, "Beside the app": its vectors are
  # those of Ollama's embeddinggemma); another model is named with EMBEDDING_WEIGHTS_URL and
  # EMBEDDING_WEIGHTS_SHA256 in .env, as well as EMBEDDING_MODEL and the rest. The image is the
  # server's, which has curl.
  embedding-model:
    image: ghcr.io/ggml-org/llama.cpp:server@sha256:2103d1f4f2e2e223ad80587dcb39fc15a9f912f29ae1fa9fc1193fe8c1aea82f
    environment:
      EMBEDDING_WEIGHTS_URL: ${EMBEDDING_WEIGHTS_URL:-https://huggingface.co/ggml-org/embeddinggemma-300M-GGUF/resolve/0f741b5a6585bd53aeb15cd1372c56f2a0f65e12/embeddinggemma-300M-Q8_0.gguf}
      EMBEDDING_WEIGHTS_SHA256: &weights ${EMBEDDING_WEIGHTS_SHA256:-b5ce9d77a3fc4b3b39ccb5643c36777911cc4eb46a66962eadfa3f5f60490d63}
    entrypoint: [/bin/sh, -c]
    command:
      - |
        set -eu
        weights="/models/$$EMBEDDING_WEIGHTS_SHA256.gguf" part=/models/download.part
        [ -f "$$weights" ] && exit 0
        curl -fsSL --retry 3 -o "$$part" "$$EMBEDDING_WEIGHTS_URL"
        if ! echo "$$EMBEDDING_WEIGHTS_SHA256  $$part" | sha256sum -c --status; then
          rm -f "$$part"
          echo "The file at EMBEDDING_WEIGHTS_URL is not the one EMBEDDING_WEIGHTS_SHA256 names." >&2
          exit 1
        fi
        mv "$$part" "$$weights"
    # As root, the owner of the new volume, but with no capability: it writes there alone.
    volumes:
      - embedding-model:/models
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: "no"

  # The embeddings endpoint (deploying.md, "The embeddings endpoint"): llama.cpp's server, on
  # this network only. It is sent every passage and every search, and sends nothing out. The
  # tag is the daily build (this digest is b11706), which Dependabot proposes each Monday and
  # CI checks against the vectors the deployments hold (.github/scripts/check-embeddings.sh).
  embeddings:
    image: ghcr.io/ggml-org/llama.cpp:server@sha256:2103d1f4f2e2e223ad80587dcb39fc15a9f912f29ae1fa9fc1193fe8c1aea82f
    depends_on:
      embedding-model:
        condition: service_completed_successfully
    environment:
      EMBEDDING_WEIGHTS_SHA256: *weights
    user: 65534:65534
    entrypoint: [/bin/sh, -c]
    # Embeddings alone, without the chat page or the slots' state, and warnings and errors
    # alone in the log, which otherwise takes lines for every input. The batches hold 24,576
    # tokens, more than any input the app sends (6,000 characters, which EmbeddingGemma reads
    # as four tokens each at most: a character it has no token for is read as its UTF-8
    # bytes): an input past the batch is refused as a server error, which the app would try
    # again, where past the model's context (2,048 tokens) it is refused as such, and the app
    # cuts it (app/embeddings.py). The larger batch takes no more memory: the container holds
    # about 200 MB with EmbeddingGemma either way.
    command:
      - >-
        exec /app/llama-server --model "/models/$$EMBEDDING_WEIGHTS_SHA256.gguf" --embeddings
        --batch-size 24576 --ubatch-size 24576 --no-webui --no-slots --log-verbosity 2
    volumes:
      - embedding-model:/models:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, curl, -fsS, -o, /dev/null, http://127.0.0.1:8080/health]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped

  # Caddy, with the tls profile (deploying.md, "Caddy"): on the host's network, so that it
  # answers on 80 and 443 and reaches the API where any proxy on the machine would,
  # 127.0.0.1:8000, whose requests come from the gateway FORWARDED_ALLOW_IPS names. It serves
  # APP_URL's name, and fetches and renews its certificate from Let's Encrypt once the name
  # leads to this machine and 80 and 443 reach it.
  caddy:
    image: caddy:2.11.9@sha256:e40b94d0a43b5ff69cb20568d73f10c70703df7b0ffc2298eb3d723cdc9d0bd1
    profiles: [tls]
    network_mode: host
    environment:
      APP_URL: ${APP_URL:-}
      CADDYFILE: *caddyfile
    entrypoint: [/bin/sh, -c]
    command:
      - >-
        printf '%s' "$$CADDYFILE" >/tmp/Caddyfile &&
        exec caddy run --config /tmp/Caddyfile --adapter caddyfile
    volumes:
      # The certificates and the ACME account, kept across updates.
      - caddy-data:/data
      - caddy-config:/config
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped

# A subnet of its own, so that the gateway the proxy's requests come from is known; change both
# addresses if it collides with a network this machine already reaches.
networks:
  default:
    ipam:
      config:
        - subnet: 10.73.0.0/24
          gateway: 10.73.0.1
  # The worker and the converter, and no way out of it: no gateway, so neither the internet,
  # the instance's metadata nor the database is reached from it.
  converter:
    internal: true

volumes:
  database:
  files:
  backups:
  clamdb:
  embedding-model:
  caddy-data:
  caddy-config:
